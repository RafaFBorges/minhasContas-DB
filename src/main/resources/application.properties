spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate
# O schema é versionado pelo Flyway (src/main/resources/db/migration).
# validate falha na subida se uma entidade divergir do banco; em emergência: SPRING_JPA_HIBERNATE_DDL_AUTO=none
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bancos que já têm tabelas (produção, volumes locais antigos) são marcados como V1 sem executá-lo
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Desligado por padrão (o SQL pode conter dados do usuário no log). Para ver o SQL localmente: SHOW_SQL=true no .env
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Atrás do proxy da hospedagem (que termina o TLS) a API enxerga HTTP. Com isto ela passa a respeitar
# X-Forwarded-Proto/Host, e request.isSecure() reflete o HTTPS do cliente (usado pelo HSTS).
# Só é seguro se o proxy sobrescrever esses cabeçalhos, como a Render faz
server.forward-headers-strategy=framework

# Limite de tentativas de login que falharam (em memória: vale para uma única instância da API)
login.rate-limit.window-minutes=15
login.rate-limit.max-failures-per-user=5
# Por IP: 0 desliga. NÃO ligue com forward-headers-strategy=framework: o IP da requisição vira a primeira entrada do
# X-Forwarded-For, que o cliente forja. Veja LoginRateLimiter
login.rate-limit.max-failures-per-ip=0


# Autenticação: access token (JWT) curto + refresh token rotativo guardado (hash) no banco.
# JWT_SECRET é obrigatório (mínimo 32 bytes; sem ele a API não sobe). Gere com: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=7

# Primeiro Admin: criado na subida só se ainda não existir nenhum. Defina as três variáveis ou nenhuma.
# A senha segue a política de senha do cadastro
admin.user=${ADMIN_USER:}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
# Tolerância ao repetir um refresh token recém-trocado (resposta perdida, pedidos simultâneos). Fora dela, o reuso encerra todas as sessões do usuário. 0 desliga
jwt.refresh-reuse-grace-seconds=10
# Sessões ativas por usuário: ao passar disso, um novo login encerra as mais antigas
jwt.max-sessions-per-user=10
# Vida total de uma cadeia de refresh (um login e suas trocas): depois disso é preciso entrar de novo, mesmo usando o app todo dia
jwt.refresh-chain-max-days=30
