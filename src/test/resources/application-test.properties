# Só para os testes: evita encher o log com o SQL do Hibernate
spring.jpa.show-sql=false

# Só para os testes
jwt.secret=chave-de-teste-com-bem-mais-de-trinta-e-dois-bytes-0123456789
# Os testes de reuso partem da regra estrita; a tolerância tem testes próprios, com relógio controlado
jwt.refresh-reuse-grace-seconds=0
